# Catálogo general de medios. Sin filtro temático: se guarda todo lo publicado
# en el periodo y el tema se elige al correr, con --buscar.
#   python -m scraper_noticias --pais CO --buscar "Primo Gay"
#   python -m scraper_noticias --categoria mineria,energia
#   python -m scraper_noticias --solo "Clarín,Infobae"
# Formato de cada fuente:
#   tipo = "rss"     -> feed RSS/Atom. `paginas` recorre ?paged=2..N (WordPress).
#   tipo = "sitemap" -> sitemap o news-sitemap. '{AAAAMM}' se expande a cada mes del periodo.
#   tipo = "gnews"   -> solo titulares vía Google News. Con '{buscar}' en la consulta,
#                       la fuente solo existe cuando se corre con --buscar.
# `incluir` / `excluir` filtran por subcadena de la URL; `prioritarias` entran primero al `tope`.

[general]
zona_horaria = "America/Bogota"
dias = 2          # los feeds generalistas cubren uno o dos días: correr a diario
respetar_robots = true
por_host = 3
pausa = 0.3
hilos = 16

[[medio]]
nombre = "Google News"
categoria = "buscador"
  # Titulares de cualquier medio para los términos de --buscar: llega más atrás
  # que los feeds, pero sin cuerpo (Google no entrega la URL real del artículo).
  [[medio.fuente]]
  tipo = "gnews"
  consulta = "{buscar}"


