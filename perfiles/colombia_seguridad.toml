# Perfil heredado del proyecto de origen (fuentes-publicas-noticias): prensa
# colombiana con foco en seguridad y orden público. Son los mismos feeds y
# términos del notebook de respaldo; aquí no hay geolocalización por municipio
# ni interpretación con IA, solo descubrimiento, cuerpo y filtro por términos.
#   python -m scraper_noticias --medios perfiles/colombia_seguridad.toml

[general]
zona_horaria = "America/Bogota"
dias = 7
pais_gnews = "CO"

[temas]
min_menciones = 2
densidad_min = 0.5
terminos = [
  "ELN", "disidencia*", "Clan del Golfo", "AGC", "autodefensa*", "paramilitar*",
  "extorsión", "secuestro*", "homicidio*", "masacre*", "asesinat*", "sicario*", "atentado*",
  "minería ilegal", "orden público", "desplazamiento", "oleoducto*", "explosiv*",
  "hostigamiento*", "retén ilegal", "paro armado", "reclutamiento", "narcotráfico",
  "cultivos ilícitos", "contrabando", "combate*", "guerrilla*", "grupo armado",
  "confinamiento", "mina antipersona",
]

[[medio]]
nombre = "Semana"
filtrar = true
  [[medio.fuente]]
  tipo = "rss"
  url = "https://www.semana.com/arc/outboundfeeds/rss/"

